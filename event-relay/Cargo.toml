[package]
name = "wow-event-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.40"
clap = { version = "4.5.31", features = ["derive"] }
env_logger = "0.11.6"
log = "0.4.26"
mlua = { version = "0.10.3", features = ["lua52"] }
notify = "8.0.0"
notify-debouncer-full = "0.5.0"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
serde_json = "1.0.139"
url = "2.5.4"
